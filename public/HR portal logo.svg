<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="ertitechGradient1" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="ertitechGradient2" x1="100" y1="20" x2="20" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Icon Symbol: Connected Nodes / People Hexagon -->
  <g transform="translate(10, 0)" filter="url(#subtleGlow)">
    <!-- Central Connection Network -->
    <path d="M60 36 L86 51 L86 81 L60 96 L34 81 L34 51 Z" 
          stroke="url(#ertitechGradient1)" 
          stroke-width="3" 
          stroke-linejoin="round" 
          fill="none" 
          opacity="0.3" />

    <!-- Dynamic Flow Arcs -->
    <path d="M42 46 C50 35, 70 35, 78 46" stroke="url(#ertitechGradient1)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M84 58 C92 70, 85 86, 70 91" stroke="url(#ertitechGradient2)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M36 78 C28 66, 32 50, 46 44" stroke="url(#ertitechGradient1)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Node 1: Top (Leadership) -->
    <circle cx="60" cy="28" r="9" fill="url(#ertitechGradient1)" />
    <!-- Node 2: Bottom Right (Operations) -->
    <circle cx="86" cy="74" r="8" fill="url(#ertitechGradient2)" />
    <!-- Node 3: Bottom Left (Workforce) -->
    <circle cx="34" cy="74" r="8" fill="#06B6D4" />
    
    <!-- Central Synergy Hub -->
    <circle cx="60" cy="62" r="5" fill="#4F46E5" />
  </g>

  <!-- Typography -->
  <g transform="translate(140, 0)">
    <!-- "ERTITECH" Bold Tech Indigo -->
    <text x="0" y="74" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="900" fill="#0F172A" letter-spacing="-0.02em">
      ERTI<tspan fill="#4F46E5">TECH</tspan>
    </text>

    <!-- Subtitle: "HR PORTAL" -->
    <text x="2" y="98" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="0.28em">
      HR PORTAL
    </text>

    <!-- Decorative Accent Dot -->
    <circle cx="245" cy="66" r="4.5" fill="#06B6D4" />
  </g>
</svg>
